plugins {
    id "com.android.application"
}

android {
    namespace "com.thirdpersoncube"
    compileSdk 35
    ndkVersion "25.2.9519653"

    defaultConfig {
        applicationId "com.thirdpersoncube"
        minSdk 29
        targetSdk 35
        versionCode 1
        versionName "0.1"

        ndk {
            abiFilters "arm64-v8a"
        }

        externalNativeBuild {
            cmake {
                cppFlags "-std=c++17 -frtti -fexceptions"
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix ".debug"
            debuggable true
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }

    externalNativeBuild {
        cmake {
            path file("src/main/cpp/CMakeLists.txt")
            version "3.31.6"
        }
    }

    sourceSets {
        main {
            assets.srcDirs = ["src/main/assets"]
        }
    }
}